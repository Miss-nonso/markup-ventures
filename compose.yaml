services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: markup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: markup
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U markup"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  broker:
    image: emqx/emqx:5.8.4
    profiles: [mqtt]
    ports: ["127.0.0.1:1883:1883", "127.0.0.1:18083:18083"]
  api:
    build: ./apps/api
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://markup_app:local-development-only@db:5432/markup
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8000}
      APP_ENV: ${APP_ENV:-development}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      AUTH_USERS_JSON: ${AUTH_USERS_JSON:-}
      AUTH_ROLE: ${AUTH_ROLE:-FleetOperator}
      AUTH_EMAIL: ${AUTH_EMAIL:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_TENANT_ID: ${AUTH_TENANT_ID:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./apps/api
    command: python -m app.worker
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    environment:
      API_INTERNAL_URL: http://api:8000
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres:
  redis:
